schema_version = "1.1"
artifacts = [
    "/workspace/output/pipeline.py",
    "/workspace/output/markers.json",
    "/workspace/output/report.md",
]

[task]
name = "aligned/viral-vs-bacterial-classifier"
description = "Build, interpret, and document a viral-vs-bacterial infection classifier from GSE6269 blood gene-expression: a leakage-safe modelling pipeline, a directional gene-marker table reconciled against the known interferon/neutrophil signatures, and a model card that reconciles the bundled SOFT file with the external GEO/PubMed record."

[metadata]
author_name = "X"
author_email = "X@gmail.com"
category = "biology"
tags = ["bioinformatics", "gene-expression", "geo", "classification", "feature-engineering", "scikit-learn", "model-card", "calibration", "biomarker-discovery"]
expert_time_estimate_hours = 6
difficulty_explanation = """
Distinguishing viral from bacterial infection from peripheral-blood gene expression is a real diagnostic problem in clinical genomics, and this task spans the whole workflow rather than a single fit. The data are real pediatric microarray samples from NCBI GEO series GSE6269 (a multi-platform Affymetrix study) — not synthetic — and carry the usual messiness of a public expression archive. The agent must (1) parse a raw multi-platform GEO SOFT family file, restrict to GPL96, inspect the platform annotation to collapse multi-mapped and duplicate probes onto gene symbols, recover labels from free-text sample metadata, and decide whether the array is already log-scaled; (2) engineer features and a model that genuinely generalise on a small, strongly imbalanced cohort (91 samples, ~80/20 bacterial/viral) under held-out cross-validation rather than overfitting ~13k gene features to 91 samples, while keeping the predicted probabilities calibrated and the performance robust across folds; (3) run a second, different computational mode — a differential-expression / marker analysis — and reconcile its directional gene markers against the model's own weights and against the textbook type-I interferon (viral) and neutrophil-granule (bacterial) host-response signatures; and (4) reconcile the bundled SOFT file with the external GEO/PubMed record for the study (the linked publication, the full multi-platform sample count, and how it maps to the modelled GPL96 cohort) and write it all up as a model card. The hard part is approach selection, validation, and biological interpretation under class imbalance and high dimensionality — not formatting or data cleaning — which is everyday work for a computational biologist building diagnostic classifiers from public expression data.
"""
solution_explanation = """
The deliverable is three reconciled artifacts, not a set of numbers. (1) pipeline.py exposes build_features(gse) -> (X, sample_ids, feature_names) and make_estimator(). build_features receives the already-parsed GEOparse object, restricts to GPL96, pivots probe-level VALUE measurements into a samples x probes matrix, maps probes to gene symbols via the GPL96 annotation (first symbol when multi-mapped), mean-aggregates probes hitting the same gene, restricts to the fixed 91-sample cohort, and applies only label-independent transforms (clip negatives, log2 if the 99th percentile indicates raw intensities); it returns gene symbols as feature_names so every column is inspectable and tie-able to a marker. Because build_features never sees labels, it cannot leak supervised information across folds. make_estimator returns a scikit-learn Pipeline of StandardScaler -> L1-penalised logistic regression (liblinear, C=1, balanced class weights, seed 123); putting the scaler inside the estimator means even feature scaling is refit per training fold, and logistic outputs give calibrated probabilities. (2) markers.json reports the leading directional genes from a per-gene mean-difference analysis cross-checked against the model's non-zero coefficients: viral_up = the interferon-stimulated-gene block (IFI27, IFI44L, IFIT1/3, ISG15, MX1, OAS1/2/3, RSAD2, USP18, SIGLEC1), bacterial_up = the neutrophil granule block (LTF, CAMP, ELANE, MPO, BPI, DEFA1/4, CEACAM8, OLFM4, MMP8). (3) report.md is a model card covering feature engineering, leakage controls, per-fold AUC variance and feature stability, calibration (Brier), the biological interpretation of the two signatures, and the reconciliation of the bundled SOFT (PubMed 17105821; 143 deposited samples across GPL96/GPL570/GPL2507) with the 91-sample GPL96 cohort. The key insight is that the viral/bacterial axis is the interferon-vs-neutrophil host response, so a sparse, balanced linear model saturates AUC, stays calibrated, and its top features recover known biology.
"""
verification_explanation = """
The verifier imports the agent's pipeline.py, parses the GEO SOFT file once, and independently derives the ground-truth labels from characteristics_ch1 for the GPL96 cohort (influenza A -> 1; E. coli / S. aureus / S. pneumoniae -> 0), asserting exactly 91 labelled samples. It calls build_features(gse), requiring the (X, sample_ids, feature_names) contract, the returned sample set to equal those 91, and X finite and aligned to both sample_ids and feature_names. It then runs its OWN StratifiedKFold(n_splits=5, shuffle=True, random_state=123): per fold it fits a fresh make_estimator() on the training rows and scores the held-out rows. Passing requires ALL of: (a) mean held-out AUC-ROC >= 0.90 and worst single fold >= 0.80 (ranking + robustness); (b) mean held-out Brier <= 0.15 (calibration, via predict_proba); (c) markers.json lists >= 8 directional genes per class, all present in feature_names, none shared, with >= 80% directionally correct against the verifier-computed viral/bacterial mean difference, and >= 3 genes per class overlapping the verifier's canonical interferon (ISG) and neutrophil gene sets; (d) a plain logistic model the verifier builds from ONLY the agent's reported markers still reaches mean CV AUC >= 0.85 (the markers must carry the signal). All thresholds sit well inside the reference pipeline's honest scores (mean AUC ~0.98, worst fold ~0.93, Brier ~0.04, marker-only AUC ~0.96) and far above chance, so the gates reject weak, miscalibrated, or biologically-implausible submissions while admitting any genuinely predictive pipeline. The agent also writes report.md, a model card covering feature engineering, leakage controls, CV variance and feature stability, calibration, the interferon/neutrophil interpretation, and the reconciliation of the bundled SOFT (PubMed 17105821; 143 deposited samples across GPL96/GPL570/GPL2507) with the modelled 91-sample GPL96 cohort; it is a required deliverable retained for human review but is not machine-scored. Because the verifier — not the agent — owns the splits, the labels, the signature gene sets, and the scoring, the score cannot be inflated by training on held-out data.
"""

[verifier]
timeout_sec = 300.0
user = "root"

[agent]
timeout_sec = 1800.0
user = "agent"

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
allow_internet = true
